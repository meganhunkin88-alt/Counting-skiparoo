<!DOCTYPE html>
<html lang="en">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Counting Skiparoo</title>
<style>
  :root{
    --bg:#fffdf8; --ink:#1f2937; --muted:#6b7280; --accent:#22c55e; --accent2:#f59e0b;
    --card:#ffffff; --shadow:0 8px 24px rgba(0,0,0,.08); --radius:18px;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, Arial; color:var(--ink); background:linear-gradient(180deg,#fff,#fffdf8 50%,#fff 100%) fixed;}
  header{position:sticky; top:0; z-index:10; padding:14px 16px; background:rgba(255,253,248,.9); backdrop-filter:saturate(160%) blur(8px); box-shadow:0 1px 0 #0001}
  .brand{font-weight:900; letter-spacing:.3px; display:flex; align-items:center; gap:10px}
  .brand .logo{width:34px; height:34px; border-radius:10px; background:conic-gradient(from 0deg, #fde047, #fb7185, #60a5fa, #22c55e, #fde047); box-shadow:var(--shadow)}
  main{max-width:940px; margin:16px auto; padding:0 16px; display:grid; gap:16px}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  select,button{font-size:16px; border:0; padding:12px 14px; border-radius:14px; background:#f4f6ff; color:#111; box-shadow:var(--shadow)}
  button.primary{background:var(--accent); color:#fff; font-weight:800}
  .wrap{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px}
  .hud{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  .stars{display:flex; gap:6px; align-items:center}
  .star{font-size:24px}
  .score{font-weight:900}
  .progress{height:10px; background:#eef2ff; border-radius:999px; overflow:hidden}
  .bar{height:100%; width:0%; background:linear-gradient(90deg, var(--accent), #16a34a); transition:width .3s}
  .stage{display:grid; grid-template-columns: 1fr; gap:14px; text-align:center}
  .big{font-size:min(22vw, 120px); line-height:1; font-weight:900; letter-spacing:.03em}
  .sub{color:var(--muted); font-weight:700}
  .choices{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
  .choice{padding:16px; font-size:28px; font-weight:900; border-radius:16px; background:#f8fafc; box-shadow:var(--shadow)}
  .choice:active{transform:scale(.98)}
  .badge{padding:8px 12px; border-radius:999px; background:#fff7ed; color:#b45309; font-weight:800}
  .good{background:#ecfdf5; color:#047857}
  .bad{background:#fef2f2; color:#b91c1c}
  .footerNote{color:var(--muted); text-align:center; font-size:13px}
</style>
</head>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(console.error);
  });
}
</script><body>
  <header>
    <div class="brand"><div class="logo"></div> <div>Counting <span style="color:#16a34a">Skiparoo</span></div></div>
  </header>

  <main>
    <div class="wrap">
      <div class="row">
        <label class="badge">Mode</label>
        <select id="mode">
          <option value="f1">Count forward to 100 (1s)</option>
          <option value="b1">Count backward to 0 (1s)</option>
          <option value="f2">Count forward to 100 (by 2s)</option>
          <option value="b2">Count backward to 0 (by 2s)</option>
        </select>
        <button id="start" class="primary">Start</button>
        <div class="badge" id="streak">Streak: 0</div>
      </div>

      <div class="hud">
        <div class="stars" id="stars"></div>
        <div class="score" id="score">Score: 0</div>
      </div>

      <div class="progress"><div class="bar" id="bar"></div></div>

      <div class="stage">
        <div class="sub" id="goal">Tap the next number</div>
        <div class="big" id="current">—</div>
        <div class="choices" id="choices"></div>
        <div id="msg" class="footerNote"></div>
      </div>
    </div>

    <div class="footerNote">Tip: perfect streaks earn bonus ⭐️</div>
  </main>

<script>
  // ------- Game logic -------
  const modeSel = document.getElementById('mode');
  const startBtn = document.getElementById('start');
  const choicesEl = document.getElementById('choices');
  const currentEl = document.getElementById('current');
  const starsEl = document.getElementById('stars');
  const scoreEl = document.getElementById('score');
  const barEl = document.getElementById('bar');
  const msgEl = document.getElementById('msg');
  const streakEl = document.getElementById('streak');
  const goalEl = document.getElementById('goal');

  let step = 1, dir = 1, start = 0, end = 100;
  let value = 0, target = 0, score = 0, streak = 0, done = false, totalSteps = 0, stepsDone = 0;

  function setMode(key){
    if(key==='f1'){ step=1; dir=+1; start=0; end=100; goalEl.textContent="Tap the next number";}
    if(key==='b1'){ step=1; dir=-1; start=100; end=0; goalEl.textContent="Tap the previous number";}
    if(key==='f2'){ step=2; dir=+1; start=0; end=100; goalEl.textContent="Tap the next number (by 2s)";}
    if(key==='b2'){ step=2; dir=-1; start=100; end=0; goalEl.textContent="Tap the previous number (by 2s)";}
    totalSteps = Math.floor(Math.abs(end-start)/step);
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function wrongChoice(correct){
    // pick a nearby wrong number that is valid 0..100 and not equal to correct
    let w;
    for(let tries=0; tries<20; tries++){
      const jitter = randInt(1, Math.max(2, step*2)) * (Math.random()<.5?-1:1);
      w = correct + jitter;
      if(w>=0 && w<=100 && w!==correct) return w;
    }
    // fallback
    w = correct + (step* (Math.random()<.5?3:-3));
    return Math.min(100, Math.max(0, w));
  }

  function drawStars(n){
    starsEl.innerHTML = '';
    for(let i=0;i<Math.min(n,10);i++){
      const s = document.createElement('div'); s.className='star'; s.textContent='⭐️';
      starsEl.appendChild(s);
    }
  }

  function updateHUD(){
    scoreEl.textContent = "Score: " + score;
    streakEl.textContent = "Streak: " + streak;
    barEl.style.width = (stepsDone/Math.max(totalSteps,1)*100)+"%";
  }

  function confetti(){
    // simple emoji burst
    const em = ['🎉','✨','🌟','🎈','💥','🦘','⭐️'];
    for(let i=0;i<18;i++){
      const span=document.createElement('span');
      span.textContent=em[randInt(0,em.length-1)];
      span.style.position='fixed';
      span.style.left=randInt(5,95)+'vw';
      span.style.top='-10vh';
      span.style.fontSize=randInt(16,34)+'px';
      span.style.transition='transform 1.2s ease-out, opacity 1.2s';
      document.body.appendChild(span);
      setTimeout(()=>{ span.style.transform=`translateY(${randInt(80,110)}vh) rotate(${randInt(-90,90)}deg)`; span.style.opacity='.0'; }, 20);
      setTimeout(()=> span.remove(), 1400);
    }
  }

  function nextRound(reset=false){
    if(reset){ stepsDone=0; score=0; streak=0; drawStars(0); setMode(modeSel.value); value=start; }
    currentEl.textContent = value;
    target = value + dir*step;
    done = (dir>0? value>=end : value<=end);

    // Build choices
    choicesEl.innerHTML = "";
    if(done){
      msgEl.innerHTML = `<span class="badge good">Great job! Sequence finished.</span>`;
      confetti();
      return;
    }
    const correct = target;
    const opts = new Set([correct, wrongChoice(correct), wrongChoice(correct)]);
    // ensure 3 options
    while(opts.size<3) opts.add(wrongChoice(correct));
    const arr = Array.from(opts).sort(()=>Math.random()-.5);
    arr.forEach(n=>{
      const btn=document.createElement('button');
      btn.className='choice';
      btn.textContent=n;
      btn.onclick=()=> choose(n);
      choicesEl.appendChild(btn);
    });
    msgEl.textContent = '';
  }

  function choose(n){
    if(n===target){
      score += 10;
      streak += 1;
      stepsDone += 1;
      if(streak % 5 === 0){ score += 10; drawStars(streak/5); } // bonus every 5 streak
      value = target; // advance
      msgEl.innerHTML = `<span class="badge good">Nice! +10${(streak%5===0)?' + bonus ⭐️':''}</span>`;
      confetti();
    }else{
      streak = 0;
      msgEl.innerHTML = `<span class="badge bad">Oops — try again</span>`;
    }
    updateHUD();
    setTimeout(nextRound, 350);
  }

  startBtn.addEventListener('click', ()=> nextRound(true));
  modeSel.addEventListener('change', ()=> nextRound(true));

  // boot
  setMode(modeSel.value);
  updateHUD();
</script>
</body>
</html>
