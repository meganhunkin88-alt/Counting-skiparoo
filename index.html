<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Counting Skiparoo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#22c55e">
<style>
body{font-family:sans-serif;text-align:center;background:#fffdf8;color:#333;margin:0;padding:0}
h1{color:#22c55e;margin:20px 0}
button{background:#22c55e;color:#fff;border:none;border-radius:10px;padding:15px 25px;font-size:1.2em;margin:10px}
button:active{background:#1ea34d}
#number{font-size:6em;margin:20px 0;color:#f59e0b}
#stars{font-size:2em;margin-top:10px;color:#facc15}
</style>
</head>
<body>
<h1>🦅 Counting Skiparoo</h1>
<div id="number">1</div>
<button id="next">Next</button>
<button id="back" disabled>Back</button>
<div id="stars">⭐️</div>

<script>
let count = 1;
const number = document.getElementById("number");
const stars = document.getElementById("stars");
const next = document.getElementById("next");
const back = document.getElementById("back");

function updateDisplay(){
  number.textContent = count;
  stars.textContent = "⭐️".repeat(Math.floor(count/10));
  back.disabled = count === 1;
  next.disabled = count === 100;
}

next.onclick = ()=>{if(count<100){count++;updateDisplay()}};
back.onclick = ()=>{if(count>1){count--;updateDisplay()}};

updateDisplay();
</script>
</body>
</html>
